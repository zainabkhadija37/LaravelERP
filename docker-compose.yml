version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: erp_app
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - erp_network
    depends_on:
      - pgsql
      - redis

  nginx:
    image: nginx:1.27-alpine
    container_name: erp_nginx
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - erp_network
    depends_on:
      - app

  pgsql:
    image: postgres:16-alpine
    container_name: erp_pgsql
    restart: unless-stopped
    environment:
      POSTGRES_DB: laravel_erp
      POSTGRES_USER: erp_user
      POSTGRES_PASSWORD: secret
    volumes:
      - erp_pgsql_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - erp_network

  redis:
    image: redis:7-alpine
    container_name: erp_redis
    ports:
      - "6379:6379"
    networks:
      - erp_network

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: erp_queue
    working_dir: /var/www
    command: php artisan queue:work redis --tries=3 --backoff=5
    volumes:
      - ./:/var/www
    networks:
      - erp_network
    depends_on:
      - app
      - redis

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: erp_scheduler
    working_dir: /var/www
    command: sh -c "while true; do php artisan schedule:run; sleep 60; done"
    volumes:
      - ./:/var/www
    networks:
      - erp_network
    depends_on:
      - app

  mailhog:
    image: mailhog/mailhog
    container_name: erp_mailhog
    ports:
      - "8025:8025"
    networks:
      - erp_network

networks:
  erp_network:
    driver: bridge

volumes:
  erp_pgsql_data:
